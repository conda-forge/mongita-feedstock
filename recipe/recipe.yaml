schema_version: 1

context:
  name: mongita
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/mongita-${{ version }}.tar.gz
  sha256: 27487d1deb40d83e4ecb107c3d9d732d369a83cc5f10599ba86fc024e2ce9cda

build:
  number: 3
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - pymongo >=3.0,<5.0
    - python >=${{ python_min }}
    - sortedcontainers >=2.3,<3.0

tests:
  - python:
      imports:
        - benchmark_tests
        - mongita
      pip_check: true
      python_version: ${{ python_min }}

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: Mongita is to MongoDB as SQLite is to SQL
  description: |
    Mongita is a lightweight embedded document database that implements a
    commonly-used subset of the MongoDB/PyMongo interface. Mongita differs
    from MongoDB in that instead of being a server, Mongita is a self-
    contained Python library. Mongita can be configured to store its
    documents either on disk or in memory.
  homepage: https://github.com/scottrogowski/mongita
  repository: https://github.com/scottrogowski/mongita
  documentation: https://github.com/scottrogowski/mongita

extra:
  recipe-maintainers:
    - jan-janssen
